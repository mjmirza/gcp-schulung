<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Agent Builder Search</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 900px;
        text-align: center;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      .container:hover {
        transform: translateY(-5px);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
      }

      .header {
        margin-bottom: 40px;
      }

      .header h1 {
        color: #2c3e50;
        font-size: clamp(2.5rem, 6vw, 4rem);
        margin-bottom: 20px;
        font-weight: 600;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: fadeInUp 0.8s ease-out;
      }

      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .header p {
        color: #5a6c7d;
        font-size: clamp(1.1rem, 2.5vw, 1.4rem);
        line-height: 1.6;
        max-width: 600px;
        margin: 0 auto;
        animation: fadeInUp 0.8s ease-out 0.2s both;
      }

      .search-section {
        margin: 0 auto;
        width: 100%;
        max-width: 700px;
        animation: fadeInUp 0.8s ease-out 0.4s both;
      }

      #searchWidgetTrigger {
        width: 100%;
        height: 70px;
        padding: 0 40px;
        font-size: clamp(1.2rem, 2.5vw, 1.5rem);
        border: 3px solid transparent;
        border-radius: 35px;
        outline: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        background: linear-gradient(white, white) padding-box,
          linear-gradient(135deg, #667eea, #764ba2) border-box;
        cursor: pointer;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1),
          0 0 0 1px rgba(255, 255, 255, 0.2) inset;
        position: relative;
        overflow: hidden;
        color: #2c3e50;
        font-weight: 500;
      }

      #searchWidgetTrigger::placeholder {
        color: #a0a8b0;
        transition: color 0.3s ease;
      }

      #searchWidgetTrigger:focus,
      #searchWidgetTrigger:hover {
        border-color: transparent;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15),
          0 0 0 1px rgba(255, 255, 255, 0.3) inset;
        transform: translateY(-3px) scale(1.02);
      }

      #searchWidgetTrigger:hover::placeholder {
        color: #667eea;
      }

      #searchWidgetTrigger::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          135deg,
          rgba(102, 126, 234, 0.1),
          rgba(118, 75, 162, 0.1)
        );
        transform: scaleX(0);
        transform-origin: right;
        transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        border-radius: 35px;
      }

      #searchWidgetTrigger:hover::before {
        transform: scaleX(1);
        transform-origin: left;
      }

      .search-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.98);
        backdrop-filter: blur(4px);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        padding: 40px 20px;
        box-shadow: 0 0 30px rgba(0, 0, 0, 0.15);
        transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        transform: translateY(100%);
      }

      .search-container.active {
        transform: translateY(0);
      }

      .close-search {
        position: absolute;
        top: 40px;
        right: 40px;
        width: 50px;
        height: 50px;
        border: none;
        background: rgba(0, 0, 0, 0.05);
        cursor: pointer;
        padding: 0;
        border-radius: 50%;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(10px);
      }

      .close-search:hover {
        background: rgba(255, 0, 0, 0.1);
        transform: rotate(90deg) scale(1.1);
        box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
      }

      .close-search::before,
      .close-search::after {
        content: "";
        position: absolute;
        width: 24px;
        height: 3px;
        background: #333;
        left: 50%;
        top: 50%;
        transition: all 0.3s ease;
        border-radius: 2px;
      }

      .close-search::before {
        transform: translate(-50%, -50%) rotate(45deg);
      }

      .close-search::after {
        transform: translate(-50%, -50%) rotate(-45deg);
      }

      .close-search:hover::before,
      .close-search:hover::after {
        background: #e74c3c;
        width: 26px;
      }

      @media (max-width: 768px) {
        .container {
          padding: 15px;
        }

        #searchWidgetTrigger {
          height: 50px;
          padding: 0 20px;
        }
      }

      @media (max-width: 480px) {
        .header {
          margin-bottom: 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>AI Search</h1>
        <p>Ask anything</p>
      </div>

      <div class="search-section">
        <input placeholder="Click here to search..." id="searchWidgetTrigger" />
      </div>
    </div>

    <div class="search-container">
      <button class="close-search" aria-label="Close search"></button>
    </div>

    <!-- Widget JavaScript bundle -->
    <script src="https://cloud.google.com/ai/gen-app-builder/client?hl=en_US"></script>

    <!-- Search widget element is not visible by default -->
    <gen-search-widget
      configId="f5815b01-b4c6-41d4-b14c-244a43926d8f"
      location="eu"
      triggerId="searchWidgetTrigger"
    >
    </gen-search-widget>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const searchTrigger = document.getElementById("searchWidgetTrigger");
        const searchContainer = document.querySelector(".search-container");
        const closeButton = document.querySelector(".close-search");
        let isAnimating = false;

        function openSearch() {
          if (isAnimating) return;
          isAnimating = true;
          searchContainer.classList.add("active");
          document.body.style.overflow = "hidden";
          setTimeout(() => {
            isAnimating = false;
          }, 600);
        }

        function closeSearch() {
          if (isAnimating) return;
          isAnimating = true;
          searchContainer.classList.remove("active");
          setTimeout(() => {
            document.body.style.overflow = "";
            isAnimating = false;
          }, 600);
        }

        searchTrigger.addEventListener("click", openSearch);
        closeButton.addEventListener("click", (e) => {
          e.stopPropagation();
          closeSearch();
        });

        // Prevent closing when clicking inside the search widget
        const searchWidget = document.querySelector("gen-search-widget");
        if (searchWidget) {
          searchWidget.addEventListener("click", (e) => {
            e.stopPropagation();
          });
        }

        // Close search when clicking outside the search widget but inside the container
        searchContainer.addEventListener("click", (e) => {
          // Only close if clicking on the container itself, not on child elements
          if (e.target === searchContainer) {
            closeSearch();
          }
        });

        // Close search when pressing Escape key
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !isAnimating) {
            closeSearch();
          }
        });
      });
    </script>
  </body>
</html>
